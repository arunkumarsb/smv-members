{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Edit Member</h1>

  {% if errors %}
  <div class="errors">
    <ul style="margin:0; padding-left:18px;">
      {% for e in errors %}
      <li>{{ e }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ form.get('name', '') }}">

    <label for="designation">Designation</label>
    <input type="text" id="designation" name="designation" value="{{ form.get('designation', '') }}">

    <label for="site_number">Site Number</label>
    <input type="text" id="site_number" name="site_number" value="{{ form.get('site_number', '') }}">

    <label for="phone_number">Phone Number</label>
    <input type="tel" id="phone_number" name="phone_number" value="{{ form.get('phone_number', '') }}">

    <label for="photo">Photo (leave blank to keep current)</label>
    <input type="file" id="photo" name="photo" accept="image/*" capture="environment">

    <button type="submit">Save Changes</button>
  </form>
</div>
{% endblock %}
